label: "BETTERON"
grub2:
  default: 0
  timeout: 5
  entries:
    - name: "Launch Better On Live Desktop"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=BETTERON enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Launch Better On Live Desktop (Basic Graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=BETTERON enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
