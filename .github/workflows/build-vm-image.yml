name: Build Better On VM disk image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-vm-image:
    name: Build ${{ matrix.variant }} QCOW2 image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: desktop
          - variant: nvidia
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require a published default-branch image
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow on the default branch so its commit-tagged image exists in GHCR." >&2
            exit 1
          fi

      - name: Set image reference
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ github.event.repository.name }}
          IMAGE_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          image_owner="${IMAGE_OWNER,,}"
          image_name="${IMAGE_NAME,,}"
          if [[ "$IMAGE_VARIANT" == "nvidia" ]]; then
            image_tag="nvidia-${GITHUB_SHA}"
          else
            image_tag="$GITHUB_SHA"
          fi
          echo "PAYLOAD_REF=ghcr.io/${image_owner}/${image_name}:${image_tag}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_USER" --password-stdin

      - name: Resolve and verify signed OS image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
          IMAGE_REF: ${{ env.PAYLOAD_REF }}
        run: |
          set -euo pipefail
          test -s build_files/cosign.pub || { echo "Add the Better On public key at build_files/cosign.pub." >&2; exit 1; }
          sudo podman pull "$IMAGE_REF"
          image_digest=$(sudo podman image inspect --format '{{.Digest}}' "$IMAGE_REF")
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Could not resolve OS image digest." >&2; exit 1; }
          image_repository="${IMAGE_REF%%:*}"
          immutable_ref="${image_repository}@${image_digest}"
          cosign verify --key build_files/cosign.pub \
            --registry-username "$GH_USER" --registry-password "$GH_TOKEN" \
            "$immutable_ref"
          echo "PAYLOAD_REF=${immutable_ref}" >> "$GITHUB_ENV"

      - name: Build bootable QCOW2 disk
        uses: osbuild/image-builder-action@a56f95dd77327e604a4f4d9fc06a9641313fda36 # pinned upstream commit
        with:
          image_type: qcow2
          bootc_ref: ${{ env.PAYLOAD_REF }}
          bootc_default_fs: btrfs
          image_builder_ref: ghcr.io/osbuild/image-builder-cli:latest@sha256:5d0e2c5879dadd3039b737bee67ee808a729ac0b5463398eb72ac1c9cca3d7c5

      - name: Create disk checksum
        env:
          IMAGE_VARIANT: ${{ matrix.variant }}
          PAYLOAD_REF: ${{ env.PAYLOAD_REF }}
        run: |
          set -euo pipefail
          mapfile -d '' disk_files < <(find output -type f -name '*.qcow2' -print0)
          test "${#disk_files[@]}" -eq 1
          printf 'variant=%s\nsource_image=%s\n' "$IMAGE_VARIANT" "$PAYLOAD_REF" > output/BUILD-INFO.txt
          sha256sum "${disk_files[0]}" output/BUILD-INFO.txt > output/SHA256SUMS

      - name: Upload VM disk and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: better-on-vm-${{ matrix.variant }}
          path: output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
