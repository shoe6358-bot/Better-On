name: Build installer ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ${{ matrix.variant }} Anaconda installer ISO
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: desktop
          - variant: nvidia
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Require a published default-branch image
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow on the default branch so its commit-tagged image exists in GHCR."
            exit 1
          fi

      - name: Set image reference
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ github.event.repository.name }}
          IMAGE_VARIANT: ${{ matrix.variant }}
        run: |
          image_owner="${IMAGE_OWNER,,}"
          image_name="${IMAGE_NAME,,}"
          echo "IMAGE_OWNER=${image_owner}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${image_name}" >> "$GITHUB_ENV"
          echo "IMAGE_VARIANT=${IMAGE_VARIANT}" >> "$GITHUB_ENV"
          if [[ "$IMAGE_VARIANT" == "nvidia" ]]; then
            image_tag="nvidia-${GITHUB_SHA}"
          else
            image_tag="$GITHUB_SHA"
          fi
          echo "PAYLOAD_REF=ghcr.io/${image_owner}/${image_name}:${image_tag}" >> "$GITHUB_ENV"

      - name: Install Cosign for installer payload verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_USER" --password-stdin

      - name: Verify signed Better On installer payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
          IMAGE_REF: ${{ env.PAYLOAD_REF }}
        run: |
          set -euo pipefail
          test -s build_files/cosign.pub || { echo "Add the Better On public key at build_files/cosign.pub." >&2; exit 1; }
          sudo podman pull "$IMAGE_REF"
          image_digest=$(sudo podman image inspect --format '{{.Digest}}' "$IMAGE_REF")
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Could not resolve installer payload digest." >&2; exit 1; }
          image_repository="${IMAGE_REF%%:*}"
          immutable_ref="${image_repository}@${image_digest}"
          cosign verify --key build_files/cosign.pub \
            --registry-username "$GH_USER" --registry-password "$GH_TOKEN" \
            "$immutable_ref"
          echo "PAYLOAD_REF=${immutable_ref}" >> "$GITHUB_ENV"

      - name: Build and publish the Anaconda installer environment
        env:
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          installer_ref="ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}-installer:${IMAGE_VARIANT}-${GITHUB_SHA}"
          sudo podman build --pull=newer \
            --build-arg "CONTAINER_NAME=${PAYLOAD_REF}" \
            --tag "$installer_ref" \
            --file installer/Containerfile .
          sudo podman push "$installer_ref"
          echo "INSTALLER_REF=$installer_ref" >> "$GITHUB_ENV"

      - name: Build ISO
        uses: osbuild/image-builder-action@a56f95dd77327e604a4f4d9fc06a9641313fda36 # pinned upstream commit
        with:
          image_type: bootc-generic-iso
          bootc_ref: ${{ env.INSTALLER_REF }}
          bootc_installer_payload_ref: ${{ env.PAYLOAD_REF }}
          bootc_default_fs: btrfs
          image_builder_ref: ghcr.io/osbuild/image-builder-cli:latest@sha256:5d0e2c5879dadd3039b737bee67ee808a729ac0b5463398eb72ac1c9cca3d7c5

      - name: Create ISO checksum
        run: |
          set -euo pipefail
          mapfile -d '' iso_files < <(find output -type f -name '*.iso' -print0)
          test "${#iso_files[@]}" -eq 1
          sha256sum "${iso_files[0]}" > output/SHA256SUMS

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: better-on-installer-iso-${{ matrix.variant }}
          path: output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
