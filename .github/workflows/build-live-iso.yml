name: Build Better On Live ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-live-iso:
    name: Build ${{ matrix.variant }} live installer ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: desktop
          - variant: nvidia
    steps:
      - name: Check out Better On source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out pinned Bazzite live installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ublue-os/bazzite
          ref: 264aca11a6bf3dfa2ab68c98315268a65ab9618b
          path: bazzite-upstream

      - name: Require a published default-branch image
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow on the default branch so its commit-tagged images exist in GHCR."
            exit 1
          fi

      - name: Set image references
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ github.event.repository.name }}
          IMAGE_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          image_owner="${IMAGE_OWNER,,}"
          image_name="${IMAGE_NAME,,}"
          live_base="ghcr.io/${image_owner}/${image_name}:${GITHUB_SHA}"
          if [[ "$IMAGE_VARIANT" == "nvidia" ]]; then
            payload_tag="nvidia-${GITHUB_SHA}"
          else
            payload_tag="${GITHUB_SHA}"
          fi
          echo "IMAGE_VARIANT=${IMAGE_VARIANT}" >> "$GITHUB_ENV"
          echo "LIVE_BASE_REF=${live_base}" >> "$GITHUB_ENV"
          echo "PAYLOAD_REF=ghcr.io/${image_owner}/${image_name}:${payload_tag}" >> "$GITHUB_ENV"

      - name: Install Cosign for live installer payload verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_USER" --password-stdin

      - name: Verify signed Better On live installer payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
          BASE_IMAGE_REF: ${{ env.LIVE_BASE_REF }}
          PAYLOAD_REF: ${{ env.PAYLOAD_REF }}
        run: |
          set -euo pipefail
          test -s build_files/cosign.pub || { echo "Add the Better On public key at build_files/cosign.pub." >&2; exit 1; }
          verify_image_digest() {
            local image_ref="$1"
            sudo podman pull "$image_ref" || return $?
            local image_digest
            image_digest=$(sudo podman image inspect --format '{{.Digest}}' "$image_ref") || return $?
            [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Could not resolve digest for ${image_ref}." >&2; return 1; }
            local image_repository="${image_ref%%:*}"
            local immutable_ref="${image_repository}@${image_digest}"
            cosign verify --key build_files/cosign.pub \
              --registry-username "$GH_USER" --registry-password "$GH_TOKEN" \
              "$immutable_ref" >/dev/null || return $?
            printf '%s' "$immutable_ref"
          }
          verified_base_ref=$(verify_image_digest "$BASE_IMAGE_REF")
          verified_payload_ref=$(verify_image_digest "$PAYLOAD_REF")
          echo "LIVE_BASE_REF=${verified_base_ref}" >> "$GITHUB_ENV"
          echo "PAYLOAD_REF=${verified_payload_ref}" >> "$GITHUB_ENV"

      - name: Mount large Btrfs container storage
        run: |
          set -euo pipefail
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          loop_device=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$loop_device" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Prepare the pinned Bazzite installer with Better On branding
        run: >-
          node installer/prepare-live-context.mjs
          "$GITHUB_WORKSPACE/bazzite-upstream/installer"
          "$RUNNER_TEMP/better-on-live-context"
          "$GITHUB_WORKSPACE"

      - name: Build the KDE live installer environment
        env:
          LIVE_BASE_REF: ${{ env.LIVE_BASE_REF }}
          PAYLOAD_REF: ${{ env.PAYLOAD_REF }}
          IMAGE_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg "BASE_IMAGE=${LIVE_BASE_REF}" \
            --build-arg "INSTALL_IMAGE_PAYLOAD=${PAYLOAD_REF}" \
            --build-arg "INSTALL_IMAGE_VARIANT=${IMAGE_VARIANT}" \
            --build-arg "FLATPAK_DIR_SHORTNAME=kde_flatpaks" \
            --tag "localhost/better-on-live:${IMAGE_VARIANT}" \
            --file "$RUNNER_TEMP/better-on-live-context/Containerfile" \
            "$RUNNER_TEMP/better-on-live-context"

      - name: Build live ISO with Titanoboa
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/better-on-live:${{ matrix.variant }}
          iso-dest: ${{ github.workspace }}/output/BetterOn-${{ matrix.variant }}-live.iso

      - name: Create ISO checksum
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
        run: sha256sum "$ISO_PATH" > "$ISO_PATH.sha256"

      - name: Upload live ISO and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: better-on-live-iso-${{ matrix.variant }}
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
